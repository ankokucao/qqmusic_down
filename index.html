<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QQ音乐取流下载工具</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">♫</div>
    <div class="brand-text">
      <h1>QQ音乐取流下载工具</h1>
      <p>JS 逆向溯源 · 真实 CDN 地址 · 直链下载</p>
    </div>
  </div>
  <div class="topbar-right">
    <span class="status" id="status">
      <i class="dot"></i><span id="statusText">检查中…</span>
    </span>
    <button class="icon-btn" id="themeBtn" title="切换主题">◐</button>
  </div>
</header>

<main class="layout">

  <!-- 左栏: 搜索 -->
  <section class="panel panel-left">
    <div class="panel-head">
      <h2>歌曲搜索</h2>
      <span class="hint" id="searchCount"></span>
    </div>

    <div class="search-box">
      <input type="text" id="q" placeholder="输入歌名或歌手，如：晴天 周杰伦" autocomplete="off">
      <button class="btn btn-primary" id="searchBtn">搜索</button>
    </div>

    <div class="result-list" id="results"></div>

    <div class="panel-head" style="margin-top:18px">
      <h2>已下载</h2>
      <span class="hint" id="fileCount"></span>
    </div>
    <div class="file-list" id="files"></div>
  </section>

  <!-- 右栏: 详情与取流 -->
  <section class="panel panel-right">
    <div id="empty" class="empty">
      <div class="empty-icon">🎵</div>
      <h3>选择一首歌开始</h3>
      <p>左侧搜索歌曲，点击后可获取各音质真实下载地址</p>
    </div>

    <div id="detail" class="detail hidden">
      <div class="song-head">
        <div class="cover" id="cover"></div>
        <div class="song-meta">
          <h2 id="sName">—</h2>
          <p id="sSinger">—</p>
          <div class="tags" id="sTags"></div>
        </div>
      </div>

      <div class="sec-title">
        <span>选择音质</span>
        <span class="hint" id="resolveHint"></span>
      </div>
      <div class="quality-bar" id="qualities">
        <label class="q-chip"><input type="checkbox" value="rs02" checked><span>试听片段<em>VIP曲 60s</em></span></label>
        <label class="q-chip"><input type="checkbox" value="c400" checked><span>96k AAC<em>m4a</em></span></label>
        <label class="q-chip"><input type="checkbox" value="m500" checked><span>128k MP3<em>mp3</em></span></label>
        <label class="q-chip"><input type="checkbox" value="m800"><span>320k MP3<em>需VIP</em></span></label>
        <label class="q-chip"><input type="checkbox" value="f000"><span>FLAC<em>需VIP</em></span></label>
      </div>

      <button class="btn btn-primary btn-lg" id="resolveBtn">获取下载地址</button>

      <div id="rows" class="rows"></div>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
